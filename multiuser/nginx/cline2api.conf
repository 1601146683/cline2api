# ============================================================================
# cline2api — HTTPS 反代（nginx 版）
#
# 部署位置：/etc/nginx/sites-available/cline2api.conf
#           软链到 /etc/nginx/sites-enabled/
# 依赖片段：/etc/nginx/snippets/cline2api-proxy.inc（本目录同名的 .inc 文件）
# 依赖限流：/etc/nginx/nginx.conf 的 http{} 内需有
#           limit_req_zone $binary_remote_addr zone=adminlogin:10m rate=10r/m;
#
# 路径分配（关键安全设计）：
#   /admin/  /admin/api/  ->  127.0.0.1:34581  上游管理后台（有密码）
#   /v1/                  ->  127.0.0.1:34580  多用户网关（独立 Key + 限流 + 账本）
#   其它                   ->  404
#
# 为什么不整体代理上游：上游 AccountPool.Keys 为空时**允许匿名访问**
#   （实测 GET /v1/models 无 Key 返回 200）。整体暴露 = 把账号池免费开放。
#   所以只放 /admin/，API 一律走网关。
#
# 端口按 .env 的 UPSTREAM_HOST_PORT / GATEWAY_PORT 调整（默认 34581 / 34580）。
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com;      # ← 改成你的域名

    # certbot --nginx 续期需要这个
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name panel.example.com;      # ← 改成你的域名

    ssl_certificate     /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 后台可能导入大量账号（批量粘贴 token），放宽请求体
    client_max_body_size 32m;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "no-referrer" always;
    server_tokens off;

    # ---- 管理后台（含登录暴破限流）----
    location ^~ /admin/api/login {
        limit_req zone=adminlogin burst=5 nodelay;
        proxy_pass http://127.0.0.1:34581;
        include /etc/nginx/snippets/cline2api-proxy.inc;
    }

    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:34581;
        include /etc/nginx/snippets/cline2api-proxy.inc;
    }

    location = /admin {
        return 301 /admin/;
    }

    # ---- 对外 API（走网关：独立 Key / 限流 / 用量账本）----
    # SSE 流式必须关闭缓冲，否则响应会被攒批
    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:34580;
        include /etc/nginx/snippets/cline2api-proxy.inc;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        chunked_transfer_encoding on;
    }

    # ---- 其余一律拒绝（尤其不要漏出上游根路径）----
    location / {
        return 404;
    }
}
